version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ridepulse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: ridepulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/migrations:/scripts/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: ridepulse-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ridepulse-api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - APP_ENV=local
      - DATABASE_URL=postgresql+psycopg2://postgres:localpassword@db:5432/ridepulse
      - FRONTEND_ORIGIN=http://localhost:3000
      - LOCAL_WORKER_URL=http://worker:8001/run
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ridepulse-worker
    command: uvicorn src.local_worker_api:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - .:/app
    environment:
      - APP_ENV=local
      - DATABASE_URL=postgresql+psycopg2://postgres:localpassword@db:5432/ridepulse
      - RUNNER_DATABASE_URL=postgresql+psycopg2://ridepulse_runner:YOUR_RUNNER_PASSWORD_HERE@db:5432/ridepulse
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
