ridepulse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'ridepulse_dbt') }}"
      pass: "{{ env_var('DBT_PASSWORD', 'YOUR_DBT_PASSWORD_HERE') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'ridepulse') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: 4
      keepalives_idle: 0
