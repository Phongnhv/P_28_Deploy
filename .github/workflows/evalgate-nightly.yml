name: EvalGate Nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  live-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install product and live EvalGate dependencies
        run: |
          pip install -r requirements.txt
          pip install -e "./evalgate[live]"
      - name: Run provenance-bound served path
        id: product-run
        shell: pwsh
        run: |
          $manifest = python -m evalgate.product_run --profile nightly --suite frozen-v1 --out output/evalgate-runs
          if ($LASTEXITCODE -ne 0 -or -not $manifest) { throw "Product benchmark did not finalize a manifest" }
          "manifest=$manifest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Run nightly gate
        run: >-
          python -m evalgate.run --mode nightly --manifest "${{ steps.product-run.outputs.manifest }}"
          --out evalgate/reports
        env:
          APP_ENV: test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALGATE_BUDGET_USD: "5.0"
      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evalgate-nightly-report
          path: |
            evalgate/reports/
            evalgate/evidence/
            output/evalgate-runs/
