name: Backend CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-cd-production
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      AR_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_JOB: ${{ vars.CLOUD_RUN_JOB }}
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
      IMAGE_NAME: ridepulse

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker build --pull --tag "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Resolve immutable image digest
        run: |
          set -euo pipefail
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE_URI}" --format='value(image_summary.digest)')"
          test -n "${DIGEST}"
          IMMUTABLE_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}@${DIGEST}"
          echo "IMMUTABLE_IMAGE=${IMMUTABLE_IMAGE}" >> "$GITHUB_ENV"
          echo "Deploying ${IMMUTABLE_IMAGE}"

      - name: Update Cloud Run worker job
        run: |
          gcloud run jobs update "${CLOUD_RUN_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMMUTABLE_IMAGE}"

      - name: Deploy Cloud Run API
        run: |
          gcloud run services update "${CLOUD_RUN_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMMUTABLE_IMAGE}"

      - name: Health check API
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "${API_HEALTH_URL}"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "API health check failed: ${API_HEALTH_URL}" >&2
          exit 1
