# v4: thresholds are only kept for metrics an evaluator actually produces.
# A threshold with no metric behind it is a promise about a capability that does
# not exist -- the same failure mode as a dq_score that defaults to 100.
version: "4.0"
gates:
  ai_quality:
    detection_f1_macro:      {pass: 60.0, warn: 40.0}
  ai_security:
    unauthenticated_mutating_endpoints: {pass: 0.0, warn: 0.0}
    raw_row_egress_violations:          {pass: 0.0, warn: 0.0}
    pii_column_egress_violations:       {pass: 0.0, warn: 0.0}
    secret_findings:                    {pass: 0.0, warn: 0.0}
  governance:
    policy_resolution_success_rate: {pass: 100.0, warn: 100.0}
    hitl_integrity:                 {pass: 100.0, warn: 100.0}
    required_asset_presence:        {pass: 100.0, warn: 100.0}
