# EvalGate v3 gate weights.
#
# v3 narrows the scored surface from seven gates to four.
#
# The three that were removed are not being hidden. PRODUCT_SPEC.md puts them
# outside the project's own scope, in the section headed "Explicitly outside
# Gate 2":
#
#     ...enterprise account/RBAC, HA/SLA and post-course operations.
#
#   observability  HA/SLA. OpenTelemetry is commented out in requirements.txt,
#                  so trace_coverage_v1 has never produced a measurement.
#   reliability    HA/SLA. k6 load testing needs a target and approval to put
#                  load on it; config_static_check still runs and still reports,
#                  it just no longer drives the verdict.
#   business       post-course operations. steward_behavior_v1 has never
#                  produced a measurement either.
#
# Keeping a gate in this file while nothing measures it is not coverage. It is a
# denominator that drags the measured fraction down and, worse, implies the risk
# is being watched when it is not. Between the three of them they held 0.23 of
# the weight and produced zero findings in the system's entire history.
#
# The distinction that makes this legitimate rather than convenient: a gate is
# removed here because the project declared it out of scope in writing, not
# because removing it improves the score. The same reasoning was refused on
# 2026-08-22 when the only argument for it was that coverage would clear the
# floor -- see EVALGATE_REPORT.md section 16.0.
#
# The four that remain map one-to-one onto the six safety rules the product
# wrote for itself in PRODUCT_SPEC.md#safety-rules:
#
#   input_data   -> rule 1  raw rows are immutable
#   ai_security  -> rules 2, 4, 6  aggregate-only LLM input, read-only runner,
#                                  no internal detail in public errors
#   ai_quality   -> rule 3  only an approved typed rule can compile and run
#   governance   -> rule 5  every state transition creates an audit record
#
# Their weights are the v2 values renormalised across the four, so their relative
# ordering is unchanged: security and governance still carry more than they did
# in v1 because the product stores data belonging to other people.
version: "3.0"
weights:
  ai_quality:     0.36
  ai_security:    0.29
  input_data:     0.20
  governance:     0.15

# Declared out of scope rather than deleted. Their evaluators still run and still
# appear under Metrics, so a reader can see what they say -- they simply carry no
# weight and cannot block a release. Re-add one here the day it earns a
# measurement, and the gate returns with its history intact.
out_of_scope:
  observability:
    weight_in_v2: 0.08
    reason: "HA/SLA is outside Gate 2; OpenTelemetry is commented out in requirements.txt"
  reliability:
    weight_in_v2: 0.08
    reason: "HA/SLA is outside Gate 2; load testing needs a target and approval"
  business:
    weight_in_v2: 0.07
    reason: "post-course operations are outside Gate 2"

decision_bands:
  pass:    85.0
  warning: 70.0
